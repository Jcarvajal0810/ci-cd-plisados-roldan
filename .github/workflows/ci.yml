# .github/workflows/ci.yml — CI: en cada PR y reutilizado por pipeline.yml
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build + Spotless + unitarias + integracion (Testcontainers) + contrato + JaCoCo
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Dependencias compiladas para SonarCloud
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=compile
      - name: Subir reportes del backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/classes/
            backend/target/dependency/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Lint (ESLint) + contrato OpenAPI al dia
        run: npm run lint
      - name: Unitarias (Vitest) + cobertura con umbral
        run: npm test
      - name: Build SSR
        run: npm run build
      - name: Subir cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plisados
          POSTGRES_USER: plisados
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plisados -d plisados"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build de la imagen de migraciones
        run: docker build -t plisados-db-migrate:ci ./database
      - name: Migraciones en base limpia, repetibles y validas
        run: |
          run_flyway() {
            docker run --rm --network host \
              -e FLYWAY_URL=jdbc:postgresql://localhost:5432/plisados \
              -e FLYWAY_USER=plisados -e FLYWAY_PASSWORD=ci \
              plisados-db-migrate:ci "$@"
          }
          run_flyway migrate    # 1.a: aplica V1..Vn
          run_flyway migrate    # 2.a: debe decir "Schema ... is up to date"
          run_flyway validate   # checksums coinciden con los archivos

  iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.1'
      - name: terraform fmt + validate (shared, platform, app)
        run: |
          terraform fmt -check -recursive infra
          for layer in shared platform app; do
            echo "== $layer =="
            (cd "infra/$layer" && terraform init -backend=false -input=false && terraform validate)
          done
      - name: Lint de Dockerfiles (hadolint)
        run: |
          for f in frontend/Dockerfile backend/Dockerfile database/Dockerfile; do
            echo "== $f =="
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$f"
          done

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Descargar reportes del backend
        uses: actions/download-artifact@v5
        with:
          name: backend-reports
          path: backend/target
      - name: Descargar cobertura del frontend
        uses: actions/download-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Rutas del lcov relativas a la raiz del repo
        # Vitest escribe "SF:src/..." (relativo a frontend/) y Sonar analiza desde la raiz.
        run: sed -i 's|^SF:src/|SF:frontend/src/|' frontend/coverage/pisadosroldan-frontend/lcov.info
      - name: SonarCloud Scan (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
