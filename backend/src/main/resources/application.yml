spring:
  application:
    name: pisadosroldan-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plisados}
    username: ${DB_USER:plisados}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  media-root: ${MEDIA_ROOT:./media}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
